blacklist nvidia
blacklist nvidia_uvm
blacklist nvidia_modeset
blacklist nvidia_drm
blacklist snd_hda_intel
install nvidia /usr/local/libexec/ai-egpu-gen3-ha/module_guard nvidia
install nvidia_uvm /usr/local/libexec/ai-egpu-gen3-ha/module_guard nvidia_uvm
install nvidia_modeset /usr/local/libexec/ai-egpu-gen3-ha/module_guard nvidia_modeset
install nvidia_drm /usr/local/libexec/ai-egpu-gen3-ha/module_guard nvidia_drm
install snd_hda_intel /bin/false
