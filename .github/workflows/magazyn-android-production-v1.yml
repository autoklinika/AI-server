name: Magazyn Android V1 - production unsigned build

on:
  push:
    branches:
      - release/magazyn-android-v1.0.0-20261029
    paths:
      - 'apps/magazyn/**'
      - '.github/workflows/magazyn-android-production-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magazyn-android-v1.0.0-internal-release
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Magazyn backend and ECU mapping regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "pydantic>=2,<3" "uvicorn>=0.30" "pytest>=8" "httpx>=0.27" "cryptography>=45" "openpyxl>=3.1"
      - name: Syntax and JavaScript checks
        run: |
          python -m compileall -q apps/magazyn/magazyn
          node --check apps/magazyn/android/app/src/main/assets/ecu-scan-bridge.js
          node --check apps/magazyn/android/app/src/main/assets/ecu-form-mapping.js
          node --check apps/magazyn/android/app/src/main/assets/ecu-catalog-merge.js
          node apps/magazyn/android/tests/test-ecu-form-mapping.cjs
          node apps/magazyn/android/tests/test-ecu-catalog-merge.cjs
      - name: Isolated backend suite (never connects to live Magazyn)
        working-directory: apps/magazyn
        run: PYTHONPATH=. python -m pytest tests -q --disable-warnings --maxfail=1

  assemble-unsigned-release:
    name: Android release APK - unsigned, for offline signing
    runs-on: ubuntu-latest
    needs: backend-tests
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: JUnit and release APK (no signing keys in GitHub)
        working-directory: apps/magazyn/android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease
      - name: Confirm unsigned release artifact
        run: |
          test -f apps/magazyn/android/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum apps/magazyn/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: magazyn-android-v1.0.0-unsigned-for-offline-signing
          path: apps/magazyn/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 21
          if-no-files-found: error
