name: Telegram routing audit tests
on:
  push:
    branches: [fix/telegram-multiuser-routing]
  pull_request:
    paths:
      - tools/audit_hermes_telegram_routing.py
      - tests/test_telegram_routing_audit.py
      - .github/workflows/telegram-routing-audit-tests.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s tests -p 'test_telegram_routing_audit.py' -v
