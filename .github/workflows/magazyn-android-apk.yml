name: Magazyn Android APK (DEV)

on:
  push:
    branches:
      - feature/magazyn-android-preview-20261029
    paths:
      - 'apps/magazyn/android/**'
      - '.github/workflows/magazyn-android-apk.yml'
  pull_request:
    paths:
      - 'apps/magazyn/android/**'
      - '.github/workflows/magazyn-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build and test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and debug APK
        working-directory: apps/magazyn/android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: APK checksum
        run: sha256sum apps/magazyn/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: magazyn-v1-android-debug-apk
          path: apps/magazyn/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
