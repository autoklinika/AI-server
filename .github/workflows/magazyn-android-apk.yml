name: Magazyn Android APK (DEV)

on:
  push:
    branches:
      - feature/magazyn-android-preview-20261029
      - feature/magazyn-ecu-ai-ocr-dev-20261029
      - feature/magazyn-rtx-on-demand-20261029
    paths:
      - 'apps/magazyn/android/**'
      - 'apps/magazyn/magazyn/ecu_ai.py'
      - 'apps/magazyn/magazyn/ecu_rtx.py'
      - 'apps/magazyn/magazyn/server.py'
      - 'apps/magazyn/tests/test_ecu_ai_ocr.py'
      - 'apps/magazyn/tests/test_ecu_rtx.py'
      - '.github/workflows/magazyn-android-apk.yml'
  pull_request:
    paths:
      - 'apps/magazyn/android/**'
      - '.github/workflows/magazyn-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build and test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and debug APK
        working-directory: apps/magazyn/android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: APK checksum
        run: sha256sum apps/magazyn/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: magazyn-v1-android-debug-apk
          path: apps/magazyn/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  test-ai-ocr-backend:
    name: Test isolated ECU AI endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "pydantic>=2,<3" "uvicorn>=0.30" "pytest>=8" "httpx>=0.27" "cryptography>=45" "openpyxl>=3.1"
      - name: Syntax check (backend + Android JS bridge)
        run: |
          python -m compileall -q apps/magazyn/magazyn/ecu_ai.py apps/magazyn/magazyn/ecu_rtx.py apps/magazyn/magazyn/server.py
          node --check apps/magazyn/android/app/src/main/assets/ecu-scan-bridge.js
      - name: Isolated backend tests (no production or GPU)
        working-directory: apps/magazyn
        run: PYTHONPATH=. python -m pytest tests/test_ecu_ai_ocr.py tests/test_ecu_rtx.py -q
