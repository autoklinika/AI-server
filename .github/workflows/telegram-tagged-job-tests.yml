name: Telegram tagged request reader tests
on:
  push:
    branches: [fix/telegram-multiuser-routing]
    paths:
      - tools/inspect_hermes_telegram_tagged_job.py
      - tests/test_hermes_telegram_tagged_job.py
      - .github/workflows/telegram-tagged-job-tests.yml
  pull_request:
    paths:
      - tools/inspect_hermes_telegram_tagged_job.py
      - tests/test_hermes_telegram_tagged_job.py
      - .github/workflows/telegram-tagged-job-tests.yml
permissions:
  contents: read
jobs:
  tagged-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install python-dotenv==1.2.2
      - run: python -m unittest discover -s tests -p 'test_hermes_telegram_tagged_job.py' -v
