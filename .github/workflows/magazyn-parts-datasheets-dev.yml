name: Magazyn electronics datasheet assistant DEV

on:
  push:
    branches:
      - feature/magazyn-electronics-datasheets-dev-20261029
    paths:
      - 'apps/magazyn/**'
      - '.github/workflows/magazyn-parts-datasheets-dev.yml'
  pull_request:
    paths:
      - 'apps/magazyn/**'
      - '.github/workflows/magazyn-parts-datasheets-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-datasheet-tests:
    name: Safe datasheet and existing Magazyn regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: PDF utilities for controlled text extraction
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils age
      - name: Install tests
        run: python -m pip install "fastapi>=0.115,<1" "pydantic>=2,<3" "uvicorn>=0.30" "pytest>=8" "httpx>=0.27" "cryptography>=45" "openpyxl>=3.1"
      - name: Check source syntax
        run: |
          python -m compileall -q apps/magazyn/magazyn
          node --check apps/magazyn/magazyn/static/part_datasheets.js
          node --check apps/magazyn/magazyn/static/electronics.js
      - name: All isolated Magazyn tests (offline, mocked HTTP)
        working-directory: apps/magazyn
        run: PYTHONPATH=. python -m pytest tests -q --disable-warnings --maxfail=1
