name: Stage 15-16 progressive tools

on:
  push:
    branches:
      - feat/ai-gateway-scheduler
    paths:
      - "tools/benchmark_hermes_progressive_tools_stage15.sh"
      - "tools/validate_hermes_deferred_tool_e2e_stage16.sh"
      - ".github/workflows/stage15-progressive-tools.yml"
  pull_request:
    paths:
      - "tools/benchmark_hermes_progressive_tools_stage15.sh"
      - "tools/validate_hermes_deferred_tool_e2e_stage16.sh"
      - ".github/workflows/stage15-progressive-tools.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n tools/benchmark_hermes_progressive_tools_stage15.sh
          bash -n tools/validate_hermes_deferred_tool_e2e_stage16.sh
