name: Stage 15-20 progressive tools

on:
  push:
    branches:
      - feat/ai-gateway-scheduler
    paths:
      - "tools/benchmark_hermes_progressive_tools_stage15.sh"
      - "tools/validate_hermes_deferred_tool_e2e_stage16.sh"
      - "tools/validate_hermes_deferred_tool_e2e_stage16b.sh"
      - "tools/diagnose_qwen_tool_choice_stage17.sh"
      - "tools/diagnose_hermes_system_prompt_tool_suppression_stage18.sh"
      - "tools/diagnose_hermes_streaming_tool_calls_stage19.sh"
      - "tools/diagnose_hermes_run_conversation_payload_stage20.sh"
      - ".github/workflows/stage15-progressive-tools.yml"
  pull_request:
    paths:
      - "tools/benchmark_hermes_progressive_tools_stage15.sh"
      - "tools/validate_hermes_deferred_tool_e2e_stage16.sh"
      - "tools/validate_hermes_deferred_tool_e2e_stage16b.sh"
      - "tools/diagnose_qwen_tool_choice_stage17.sh"
      - "tools/diagnose_hermes_system_prompt_tool_suppression_stage18.sh"
      - "tools/diagnose_hermes_streaming_tool_calls_stage19.sh"
      - "tools/diagnose_hermes_run_conversation_payload_stage20.sh"
      - ".github/workflows/stage15-progressive-tools.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n tools/benchmark_hermes_progressive_tools_stage15.sh
          bash -n tools/validate_hermes_deferred_tool_e2e_stage16.sh
          bash -n tools/validate_hermes_deferred_tool_e2e_stage16b.sh
          bash -n tools/diagnose_qwen_tool_choice_stage17.sh
          bash -n tools/diagnose_hermes_system_prompt_tool_suppression_stage18.sh
          bash -n tools/diagnose_hermes_streaming_tool_calls_stage19.sh
          bash -n tools/diagnose_hermes_run_conversation_payload_stage20.sh
