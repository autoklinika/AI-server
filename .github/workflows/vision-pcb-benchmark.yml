name: Vision PCB Benchmark V1
on:
  pull_request:
    paths:
      - 'benchmarks/vision_pcb_v1/**'
      - '.github/workflows/vision-pcb-benchmark.yml'
  push:
    paths:
      - 'benchmarks/vision_pcb_v1/**'
      - '.github/workflows/vision-pcb-benchmark.yml'

permissions:
  contents: read

jobs:
  offline-scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ingestion-only image dependency
        run: python -m pip install -r benchmarks/vision_pcb_v1/requirements-ingest.txt
      - name: Synthetic benchmark contracts
        run: python -m unittest discover -s benchmarks/vision_pcb_v1/tests -v
      - name: Validate synthetic manifest
        run: python benchmarks/vision_pcb_v1/benchmark.py validate --ground-truth benchmarks/vision_pcb_v1/fixtures/ground_truth.jsonl
