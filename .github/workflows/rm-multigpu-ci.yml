name: RM Multi-GPU — CPU-only quality gate

on:
  pull_request:
    branches: [main, feature/rm-multigpu-p1-github-20261031]
    paths:
      - .github/workflows/rm-multigpu-ci.yml
      - AGENTS.md
      - docs/quality/RM_MULTIGPU*
      - src/ai_bridge/providers/accelerators.py
      - src/ai_bridge/providers/resource_topology.py
      - src/ai_bridge/gateway/resource_accounting.py
      - src/ai_bridge/gateway/resource_shadow.py
      - src/ai_bridge/gateway/app.py
      - src/ai_bridge/settings.py
      - tests/test_resource_shadow_p2a.py
      - tests/test_resource_foundation_p1*.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rm-multigpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rm-multigpu-cpu:
    name: RM CPU / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 — Node.js 24
        with:
          persist-credentials: false
      - name: Setup Python (pinned)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 — Node.js 24
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and pinned quality tools
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pip install --disable-pip-version-check ruff==0.16.9 mypy==1.18.2
      - name: Compile pure CPU resource modules
        run: |
          python -m compileall -q src/ai_bridge/providers/resource_topology.py src/ai_bridge/gateway/resource_accounting.py src/ai_bridge/gateway/resource_shadow.py
      - name: Ruff lint (new P1 modules and tests)
        run: |
          ruff check --target-version py312 --select E4,E7,E9,F,B,I,UP \
            src/ai_bridge/providers/resource_topology.py \
            src/ai_bridge/gateway/resource_accounting.py \
            src/ai_bridge/gateway/resource_shadow.py \
            tests/test_resource_shadow_p2a.py \
            tests/test_resource_foundation_p1.py \
            tests/test_resource_foundation_p1_supervisor.py
      - name: Ruff formatter check
        run: |
          ruff format --target-version py312 --check \
            src/ai_bridge/providers/resource_topology.py \
            src/ai_bridge/gateway/resource_accounting.py \
            src/ai_bridge/gateway/resource_shadow.py \
            tests/test_resource_shadow_p2a.py \
            tests/test_resource_foundation_p1.py \
            tests/test_resource_foundation_p1_supervisor.py
      - name: Strict mypy (resource modules)
        run: |
          mypy --strict --follow-imports=silent \
            --python-version ${{ matrix.python-version }} \
            src/ai_bridge/providers/resource_topology.py \
            src/ai_bridge/gateway/resource_accounting.py \
            src/ai_bridge/gateway/resource_shadow.py
      - name: Regression tests (P1 + existing RM contracts)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          CUDA_VISIBLE_DEVICES: "-1"
          HIP_VISIBLE_DEVICES: "-1"
          ROCR_VISIBLE_DEVICES: "-1"
        run: |
          python -m pytest -q -p no:cacheprovider -o addopts='' \
            tests/test_resource_foundation_p1.py \
            tests/test_resource_foundation_p1_supervisor.py \
            tests/test_resource_shadow_p2a.py \
            tests/test_stage_n0_accelerators.py \
            tests/test_gateway_scheduler.py \
            tests/test_gateway_resource_leases.py \
            tests/test_gateway_unified_admission.py \
            tests/test_gpu_residency.py \
            tests/test_resource_evidence_b_dev.py \
            tests/test_gateway_api.py \
            tests/test_gateway_resource_api.py \
            tests/test_gateway_priority_classes.py \
            --junitxml=rm-multigpu-junit.xml
      - name: Store CPU-only test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 — Node.js 24
        with:
          name: rm-multigpu-junit-py${{ matrix.python-version }}
          path: rm-multigpu-junit.xml
          if-no-files-found: ignore
          retention-days: 14
