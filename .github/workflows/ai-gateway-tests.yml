name: AI Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate active deployment scripts
        run: |
          find deploy/stage-a deploy/stage-b deploy/stage-c deploy/stage-d -type f -name '*.sh' -print0 | sort -z | xargs -0 -n1 bash -n
          bash -n tools/local_video/generate-video-telegram
          bash -n tools/local_video/hermes-video-dispatch
      - name: Compile Python sources
        run: python -m compileall -q src tools/local_image tools/local_video
      - name: Provider and contract tests
        run: |
          pytest tests/test_provider_contracts.py tests/test_agent_provider_contracts.py tests/test_media_provider_contracts.py tests/test_embedding_knowledge_contracts.py
      - name: Stage D foundation tests
        run: pytest tests/test_stage_d_foundation.py
      - name: Full test suite
        run: pytest
      - name: Validate Stage D release build
        env:
          PYTHON_BIN: python
        run: |
          bash deploy/stage-d/build_release.sh "$RUNNER_TEMP/stage-d-ci-release" "ci-${GITHUB_SHA::12}"
